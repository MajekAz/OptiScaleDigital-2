<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiScale Digital LTD | UK Web Design & AI Automation Agency</title>
    <meta name="description" content="OptiScale Digital LTD: Premier UK agency for Website Design, AI Automation, and Digital Marketing. Transforming businesses with tech-forward solutions." />
    
    <!-- Favicon Configuration -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
    <link rel="mask-icon" href="favicon.svg" color="#2563EB">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                navy: '#0f172a',
                dark: '#020617',
                blue: '#2563EB',
                purple: '#A78BFA',
                cyan: '#06b6d4',
                gray: '#64748b',
                light: '#f8fafc',
              }
            },
            maxWidth: {
              'boxed': '1200px',
              'article': '800px',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              heading: ['Plus Jakarta Sans', 'sans-serif'],
            }
          },
          container: {
            center: true,
            padding: {
              DEFAULT: '1.5rem',
              lg: '2rem',
            },
            screens: {
              sm: '640px',
              md: '768px',
              lg: '1024px',
              xl: '1200px',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --section-padding-mobile: 2.5rem; /* 40px */
        --section-padding-desktop: 6rem;   /* 96px */
      }

      body { 
        font-family: 'Inter', sans-serif; 
        font-size: 16px; 
        line-height: 1.6;
        color: #0f172a;
      }

      /* Precise Typography Scale */
      .text-h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 2rem; /* 32px Mobile */
        line-height: 1.1;
        font-weight: 700;
      }

      .text-h2 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1.75rem; /* 28px Mobile */
        line-height: 1.2;
        font-weight: 700;
      }

      .text-h3 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1.5rem;
        line-height: 1.2;
        font-weight: 600;
      }

      .text-h4 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1.25rem;
        line-height: 1.3;
        font-weight: 600;
      }

      @media (min-width: 768px) {
        .text-h1 { font-size: 3.8rem; } /* 61px Desktop */
        .text-h2 { font-size: 3.0rem; } /* 48px Desktop */
        .text-h3 { font-size: 2.4rem; } /* 39px Desktop */
        .text-h4 { font-size: 1.9rem; } /* 31px Desktop */
      }

      .text-lead {
        font-size: 1.25rem; /* 20px */
        line-height: 1.6;
        font-weight: 400;
      }

      .text-body {
        font-size: 1rem; /* 16px */
        line-height: 1.6;
        font-weight: 400;
      }

      .text-small {
        font-size: 0.8rem; /* 13px */
        line-height: 1.4;
        font-weight: 500;
      }

      /* Responsive Section Padding */
      .py-section {
        padding-top: var(--section-padding-mobile);
        padding-bottom: var(--section-padding-mobile);
      }
      @media (min-width: 768px) {
        .py-section {
          padding-top: var(--section-padding-desktop);
          padding-bottom: var(--section-padding-desktop);
        }
      }

      .gradient-text {
        background: linear-gradient(to right, #2563EB, #A78BFA);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .article-width {
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body class="bg-brand-light text-brand-navy antialiased transition-colors duration-300">
    <div id="root"></div>
  </body>
</html>
